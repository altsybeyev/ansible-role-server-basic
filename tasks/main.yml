---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - python3
      - python3-pip
      - python3-dev
      - build-essential
      - libpq-dev
      - htop
      - net-tools
      - curl
      - cron
      - logrotate
      - wget
      - git
      - vim
      - tree
      - lsof
      - iotop
      - nethogs
      - unzip
      - zip
      - ncdu
      - dfc
      - btop
      - rsync
      - telnet
      - dnsutils
      - traceroute
      - fail2ban
      - crowdsec
    state: present

- name: Настроить SSH безопасность - отключить парольную аутентификацию
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: restart ssh

- name: Настроить SSH безопасность - отключить парольную аутентификацию
  lineinfile:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: restart ssh
  
- name: Настроить SSH безопасность - разрешить только ключи
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PubkeyAuthentication'
    line: 'PubkeyAuthentication yes'
    state: present
  notify: restart ssh

- name: Настроить fail2ban для SSH защиты
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 3
      
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
      bantime = 3600
    mode: '0644'
  notify: restart fail2ban

- name: Убедиться что fail2ban запущен и включен
  service:
    name: fail2ban
    state: started
    enabled: yes
